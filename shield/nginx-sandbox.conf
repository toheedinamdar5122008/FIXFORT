# ==============================================================================
# FixFort Nginx Sandbox Shield Configuration (The Practice Room)
# ==============================================================================

log_format fixfort_sandbox_json escape=json '{'
  '"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"query":"$args",'
  '"status":$status,'
  '"body_bytes_sent":$body_bytes_sent,'
  '"http_user_agent":"$http_user_agent"'
'}';

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/sandbox_access.log fixfort_sandbox_json;
    error_log /var/log/nginx/sandbox_error.log warn;

    # ModSecurity Configuration
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/modsecurity.conf;

    location / {
        proxy_pass http://victim-sandbox:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
