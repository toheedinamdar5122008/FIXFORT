# ==============================================================================
# FixFort ModSecurity Core Configuration
# ==============================================================================
# Rule engine mode: On (blocks matching malicious requests with 403)
SecRuleEngine On

# Request body inspection
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
# SecRequestBodyInMemoryLimit is deprecated and unsupported in ModSecurity v3
# SecRequestBodyInMemoryLimit 131072
SecRequestBodyLimitAction Reject

# Response body inspection (disabled for maximum performance)
SecResponseBodyAccess Off

# ModSecurity Temporary and Data directories
SecTmpDir /tmp/
SecDataDir /tmp/

# ModSecurity Audit Engine
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/modsec_audit.log

# Argument separator
SecArgumentSeparator &
SecCookieFormat 0

# Default action for blocking rules
SecDefaultAction "phase:2,deny,log,status:403"

# Include custom FixFort generated rules
# (Any file placed in rules directory is loaded dynamically)
Include /etc/nginx/modsec/rules/*.conf
