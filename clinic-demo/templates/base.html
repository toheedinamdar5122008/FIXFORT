<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greenfield Clinic — demo target</title>
<style>
:root{--bg:#0B0F17;--s1:#121A26;--s2:#18222F;--bd:#1E2A3A;--tx:#E6EDF3;--mu:#8B98A9;--cy:#22D3EE;--gn:#22C55E;--rd:#EF4444;--am:#F59E0B}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(900px 500px at 80% -10%,rgba(34,211,238,.08),transparent 60%),
  radial-gradient(700px 500px at 0% 110%,rgba(139,124,246,.07),transparent 60%),var(--bg);
  color:var(--tx);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Manrope,system-ui,sans-serif;min-height:100vh}
a{color:var(--cy);text-decoration:none}
.bar{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--bd);background:rgba(11,15,23,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand svg{filter:drop-shadow(0 0 6px rgba(34,211,238,.5))}
.mode{font:600 11px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;
  color:{{ '#fecaca' if mode=='vulnerable' else '#bbf7d0' }};
  background:{{ 'rgba(239,68,68,.12)' if mode=='vulnerable' else 'rgba(34,197,94,.12)' }};
  border:1px solid {{ 'rgba(239,68,68,.45)' if mode=='vulnerable' else 'rgba(34,197,94,.45)' }}}
.tag{font:500 11px ui-monospace,monospace;color:var(--mu);border:1px dashed var(--bd);padding:3px 9px;border-radius:6px}
nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--mu);padding:7px 13px;border-radius:7px;font-size:14px;transition:.15s}
nav a:hover{color:var(--tx);background:var(--s2)}
.wrap{max-width:680px;margin:40px auto;padding:0 20px}
.card{background:linear-gradient(180deg,#15202f,var(--s1) 70%);border:1px solid var(--bd);border-radius:16px;padding:32px;box-shadow:0 24px 60px -34px rgba(0,0,0,.9)}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:21px;margin:0 0 14px}
.lead{color:var(--mu);margin:0 0 22px}
label{display:block;font:600 12px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:16px 0 6px}
input,textarea{display:block;width:100%;background:#0d151f;border:1px solid var(--bd);border-radius:9px;color:var(--tx);
  padding:12px 14px;font:15px ui-monospace,monospace;transition:.15s}
input:focus,textarea:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
textarea{min-height:110px;resize:vertical}
button{margin-top:20px;background:var(--cy);color:#04141a;border:0;padding:12px 22px;border-radius:9px;
  font:600 15px system-ui,sans-serif;cursor:pointer;transition:.15s}
button:hover{transform:translateY(-1px);box-shadow:0 10px 26px -12px rgba(34,211,238,.7)}
.alertbox{margin:20px 0 0;padding:14px 16px;border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.alertbox .ic{font-size:16px;line-height:1.3}
.a-breach{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.45);color:#fecaca}
.a-ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.45);color:#bbf7d0}
.a-mut{background:var(--s2);border:1px solid var(--bd);color:var(--mu)}
.a-warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.45);color:#fde68a}
.cmt{background:#0d151f;border:1px solid var(--bd);border-left:3px solid var(--cy);border-radius:8px;padding:12px 14px;margin:10px 0;font-size:15px;word-break:break-word}
.foot{max-width:680px;margin:0 auto 40px;padding:0 20px;color:var(--mu);font-size:12px;text-align:center}
code{background:#0d151f;border:1px solid var(--bd);border-radius:5px;padding:2px 7px;font:13px ui-monospace,monospace;color:var(--cy)}
</style></head><body>
<div class="bar">
  <span class="brand"><svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><path d="M11 1 2 4v8c0 6 4 11 9 13 5-2 9-7 9-13V4z" fill="none" stroke="#22D3EE" stroke-width="1.6"/><path d="M8 11l2.5 2.5L15 9" fill="none" stroke="#22D3EE" stroke-width="1.6"/></svg>Greenfield Clinic</span>
  <span class="mode">Demo mode: {{ mode }}</span>
  <span class="tag">FixFort target · intentionally vulnerable · local only</span>
  <nav><a href="/">Home</a><a href="/login">Staff login</a><a href="/comment">Comments</a><a href="/upload.php">Upload</a><a href="/about">About</a></nav>
</div>
<div class="wrap">{% block c %}{% endblock %}</div>
<p class="foot">Greenfield Clinic is a fictional, deliberately-insecure demo used only to demonstrate FixFort. No real patient data. Do not deploy.</p>
</body></html>
